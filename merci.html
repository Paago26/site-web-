<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#0A0A0A;color:#FAF9F6;font-family:'Inter',sans-serif;font-weight:300;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  img.logo{width:150px;margin-bottom:44px;opacity:0;animation:fadeIn 1s ease forwards;}
  .ring{
    width:64px;height:64px;border:1px solid #C9A876;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-bottom:30px;color:#C9A876;
    opacity:0;animation:fadeIn 1s .2s ease forwards;
  }
  .ring svg{width:26px;height:26px;}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(32px,6vw,52px);
    margin-bottom:18px;opacity:0;animation:fadeIn 1s .3s ease forwards;
  }
  p{
    color:rgba(250,249,246,0.66);font-size:16px;line-height:1.7;max-width:440px;margin-bottom:40px;
    opacity:0;animation:fadeIn 1s .4s ease forwards;
  }
  a.btn{
    display:inline-flex;align-items:center;gap:10px;padding:16px 34px;
    background:#C9A876;color:#0A0A0A;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;
    font-weight:600;border-radius:30px;text-decoration:none;transition:transform .4s, background .4s;
    opacity:0;animation:fadeIn 1s .5s ease forwards;
  }
  a.btn:hover{transform:scale(1.045);background:#E7D4AC;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
